{% extends "core/base.html" %}
{% load static %}
{% block title %} {{pages.title}} | La Caffettiera {% endblock %}
{%  block content %}
    <!-- Sample Section-->
    <section class="page-section about-heading">
      <div class="container">
        <div class="about-heading-content mbtm">
          <div class="row">
            <div class="col-xl-9 col-lg-10 mx-auto">
              <div class="bg-faded rounded p-5 forced">
                <h2 class="section-heading mb-4">
                  <span class="section-heading-lower">{{pages.title}}</span>
                </h2>
                <div class="section-content">
                    <p>{{pages.content|safe}}</p>
                    {% if user.is_authenticated %}
                    <a class="btn btn-primary" href="{% url 'admin:pages_page_change' pages.id %}">Editar Página</a>
                    {% endif %}
               </div>
              </div>
            </div>
          </div>
        </div>
    <!-- Pié de página -->
{% endblock %}
    <!-- Pié de página -->
